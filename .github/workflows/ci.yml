name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Format
        run: cargo +1.96.0 fmt --check
      - name: Clippy
        run: cargo +1.96.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.96.0 test --all-targets --locked
      - name: Ceremony self-test
        run: cargo +1.96.0 run --locked --quiet --bin castalia-key-ceremony -- self-test
